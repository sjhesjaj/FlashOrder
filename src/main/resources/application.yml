spring:
  application:
    name: flashorder
  profiles:
    default: api
    group:
      dev:
        - api
        - scheduler
        - consumer
  datasource:
    url: "${FLASHORDER_DB_URL:jdbc:mysql://127.0.0.1:13306/flashorder}"
    username: ${FLASHORDER_DB_USER:flashorder}
    password: ${FLASHORDER_DB_PASSWORD:flashorder}
    hikari:
      transaction-isolation: TRANSACTION_READ_COMMITTED
      data-source-properties:
        connectionTimeZone: UTC
        forceConnectionTimeZoneToSession: "true"
        # Change isolation and autocommit through JDBC APIs so the driver's cache stays accurate.
        useLocalSessionState: "true"
  kafka:
    bootstrap-servers: ${FLASHORDER_KAFKA_BOOTSTRAP:127.0.0.1:19092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        max.block.ms: 1000
        request.timeout.ms: 3000
        delivery.timeout.ms: 5000
    consumer:
      group-id: flashorder-order-workers
      enable-auto-commit: false
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        allow.auto.create.topics: false
    listener:
      ack-mode: record
      concurrency: ${FLASHORDER_CONSUMER_CONCURRENCY:1}
  task:
    scheduling:
      pool:
        size: 2

mybatis:
  mapper-locations: classpath*:mapper/*.xml
  configuration:
    local-cache-scope: STATEMENT

server:
  address: 127.0.0.1

flashorder:
  intake-mode: "${FLASHORDER_INTAKE_MODE:sync}"

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true

---
spring:
  config:
    activate:
      on-profile: "(scheduler | consumer) & !api"
  main:
    web-application-type: none
