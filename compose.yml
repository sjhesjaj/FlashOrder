name: flashorder

services:
  mysql:
    image: mysql:8.4
    ports:
      - "127.0.0.1:${FLASHORDER_MYSQL_PORT:-13306}:3306"
    environment:
      MYSQL_DATABASE: flashorder
      MYSQL_USER: flashorder
      MYSQL_PASSWORD: ${FLASHORDER_MYSQL_PASSWORD:-flashorder}
      MYSQL_ROOT_PASSWORD: ${FLASHORDER_MYSQL_ROOT_PASSWORD:-flashorder-root}
    command:
      - --transaction-isolation=READ-COMMITTED
      - --default-time-zone=+00:00
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mysql --protocol=TCP --host=127.0.0.1 --user="$${MYSQL_USER}"
          --password="$${MYSQL_PASSWORD}" --database="$${MYSQL_DATABASE}"
          --execute="SELECT 1" >/dev/null 2>&1
      interval: 2s
      timeout: 3s
      start_period: 10s
      retries: 30

  kafka:
    image: apache/kafka:4.2.2
    profiles: [async]
    ports:
      - "127.0.0.1:${FLASHORDER_KAFKA_PORT:-19092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://127.0.0.1:${FLASHORDER_KAFKA_PORT:-19092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Keep six partitions if a producer reaches a fresh broker after application startup.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:29092", "--list"]
      interval: 5s
      timeout: 6s
      start_period: 15s
      retries: 20

volumes:
  mysql-data:
  kafka-data:
