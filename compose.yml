name: flashorder

services:
  mysql:
    image: mysql:8.4
    ports:
      - "127.0.0.1:${FLASHORDER_MYSQL_PORT:-13306}:3306"
    environment:
      MYSQL_DATABASE: flashorder
      MYSQL_USER: flashorder
      MYSQL_PASSWORD: ${FLASHORDER_MYSQL_PASSWORD:-flashorder}
      MYSQL_ROOT_PASSWORD: ${FLASHORDER_MYSQL_ROOT_PASSWORD:-flashorder-root}
    command:
      - --transaction-isolation=READ-COMMITTED
      - --default-time-zone=+00:00
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mysql --protocol=TCP --host=127.0.0.1 --user="$${MYSQL_USER}"
          --password="$${MYSQL_PASSWORD}" --database="$${MYSQL_DATABASE}"
          --execute="SELECT 1" >/dev/null 2>&1
      interval: 2s
      timeout: 3s
      start_period: 10s
      retries: 30

  kafka:
    image: apache/kafka:4.2.2
    profiles: [async]
    ports:
      - "127.0.0.1:${FLASHORDER_KAFKA_PORT:-19092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://127.0.0.1:${FLASHORDER_KAFKA_PORT:-19092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Keep six partitions if a producer reaches a fresh broker after application startup.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:29092", "--list"]
      interval: 5s
      timeout: 6s
      start_period: 15s
      retries: 20

  redis:
    image: redis:7.4.12-alpine
    profiles: [protection]
    ports:
      - "127.0.0.1:${FLASHORDER_REDIS_PORT:-16379}:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 10

  mysqld-exporter:
    image: prom/mysqld-exporter:v0.21.0
    profiles: [monitoring]
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FLASHORDER_MYSQL_EXPORTER_PORT:-19104}:9104"
    environment:
      MYSQLD_EXPORTER_PASSWORD: ${FLASHORDER_MYSQL_PASSWORD:-flashorder}
    command:
      - --mysqld.address=mysql:3306
      - --mysqld.username=flashorder
      - --config.my-cnf=/dev/null
      - --no-collect.global_variables
      - --no-collect.slave_status
      - --no-collect.info_schema.innodb_cmp
      - --no-collect.info_schema.innodb_cmpmem
      - --no-collect.info_schema.query_response_time

  prometheus:
    image: prom/prometheus:v3.13.5
    profiles: [monitoring]
    depends_on:
      - mysqld-exporter
    ports:
      - "127.0.0.1:${FLASHORDER_PROMETHEUS_PORT:-19090}:9090"
    labels:
      # Compose uses the service configuration to decide whether to recreate the container.
      flashorder.scrape-targets: >-
        ${FLASHORDER_SCRAPE_HOST:-host.docker.internal}:
        ${FLASHORDER_API_SCRAPE_PORT:-8080},${FLASHORDER_SCHEDULER_SCRAPE_PORT:-18081},${FLASHORDER_CONSUMER_SCRAPE_PORT:-18082}
    configs:
      - source: prometheus-config
        target: /etc/prometheus/prometheus.yml
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    volumes:
      - prometheus-data:/prometheus

configs:
  prometheus-config:
    content: |
      global:
        scrape_interval: 2s
        scrape_timeout: 1s
      scrape_configs:
        - job_name: mysql
          static_configs:
            - targets: ["mysqld-exporter:9104"]
        - job_name: flashorder-api
          metrics_path: /actuator/prometheus
          static_configs:
            - targets: ["${FLASHORDER_SCRAPE_HOST:-host.docker.internal}:${FLASHORDER_API_SCRAPE_PORT:-8080}"]
        - job_name: flashorder-scheduler
          metrics_path: /actuator/prometheus
          static_configs:
            - targets: ["${FLASHORDER_SCRAPE_HOST:-host.docker.internal}:${FLASHORDER_SCHEDULER_SCRAPE_PORT:-18081}"]
        - job_name: flashorder-consumer
          metrics_path: /actuator/prometheus
          static_configs:
            - targets: ["${FLASHORDER_SCRAPE_HOST:-host.docker.internal}:${FLASHORDER_CONSUMER_SCRAPE_PORT:-18082}"]

volumes:
  mysql-data:
  kafka-data:
  prometheus-data:
